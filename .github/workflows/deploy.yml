name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 매주 월요일 아침(한국 시간 9시 전)에 인기 차트와 곡 정보를 새로 받는다
    - cron: '41 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore song check cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: songs-meta-${{ github.run_id }}
          restore-keys: songs-meta-

      - name: Check songs and fetch charts
        run: npm run verify-songs
        continue-on-error: true
        timeout-minutes: 30

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
